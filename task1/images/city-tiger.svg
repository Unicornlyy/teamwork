<?xml version="1.0" encoding="UTF-8"?>
<!-- 城市风貌图 2：苏州虎丘云岩寺塔（千年斜塔），可替换为真实照片 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3f7"/>
      <stop offset="100%" stop-color="#d3e2e8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#sky2)"/>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="120" cy="110" rx="46" ry="20"/>
    <ellipse cx="158" cy="100" rx="34" ry="18"/>
    <ellipse cx="88" cy="102" rx="28" ry="15"/>
    <ellipse cx="660" cy="150" rx="40" ry="17"/>
    <ellipse cx="694" cy="142" rx="28" ry="14"/>
  </g>

  <!-- 山丘（虎丘） -->
  <path d="M0 470 Q 180 372 400 400 Q 640 360 800 452 L800 600 L0 600 Z" fill="#7aa180"/>
  <path d="M0 500 Q 220 430 430 452 Q 660 425 800 490 L800 600 L0 600 Z" fill="#5f8a66"/>

  <!-- 树丛 -->
  <g>
    <circle cx="120" cy="455" r="40" fill="#4f7a57"/>
    <circle cx="165" cy="440" r="30" fill="#5d8c64"/>
    <circle cx="660" cy="445" r="42" fill="#4f7a57"/>
    <circle cx="615" cy="452" r="28" fill="#5d8c64"/>
    <rect x="128" y="470" width="10" height="34" fill="#6b513b"/>
    <rect x="650" y="470" width="10" height="32" fill="#6b513b"/>
  </g>

  <!-- ========== 云岩寺塔（整体微倾，呼应“东方比萨斜塔”） ========== -->
  <g transform="rotate(5 400 472)">

    <!-- 七层塔身与塔檐，自下而上逐层收分 -->
    <!-- 第 1 层 -->
    <rect x="305" y="430" width="190" height="44" fill="#e9d8b2" stroke="#a08a63" stroke-width="2"/>
    <path d="M291 438 Q400 412 509 438 L503 438 Q400 426 297 438 Z" fill="#63513f"/>
    <rect x="391" y="446" width="18" height="26" rx="8" fill="#5a442f"/>
    <rect x="333" y="448" width="12" height="20" rx="5" fill="#6f5738"/>
    <rect x="455" y="448" width="12" height="20" rx="5" fill="#6f5738"/>

    <!-- 第 2 层 -->
    <rect x="313" y="388" width="174" height="42" fill="#efe0bd" stroke="#a08a63" stroke-width="2"/>
    <path d="M300 396 Q400 372 500 396 L495 396 Q400 386 305 396 Z" fill="#63513f"/>
    <rect x="392" y="403" width="16" height="24" rx="7" fill="#5a442f"/>

    <!-- 第 3 层 -->
    <rect x="321" y="346" width="158" height="42" fill="#e9d8b2" stroke="#a08a63" stroke-width="2"/>
    <path d="M309 354 Q400 330 491 354 L486 354 Q400 344 314 354 Z" fill="#63513f"/>
    <rect x="393" y="361" width="14" height="24" rx="6" fill="#5a442f"/>
    <rect x="345" y="363" width="11" height="18" rx="5" fill="#6f5738"/>
    <rect x="444" y="363" width="11" height="18" rx="5" fill="#6f5738"/>

    <!-- 第 4 层 -->
    <rect x="329" y="304" width="142" height="42" fill="#efe0bd" stroke="#a08a63" stroke-width="2"/>
    <path d="M318 312 Q400 290 482 312 L477 312 Q400 303 323 312 Z" fill="#63513f"/>
    <rect x="393" y="319" width="14" height="24" rx="6" fill="#5a442f"/>

    <!-- 第 5 层 -->
    <rect x="337" y="262" width="126" height="42" fill="#e9d8b2" stroke="#a08a63" stroke-width="2"/>
    <path d="M327 270 Q400 248 473 270 L468 270 Q400 261 332 270 Z" fill="#63513f"/>
    <rect x="394" y="277" width="12" height="24" rx="6" fill="#5a442f"/>
    <rect x="358" y="279" width="10" height="18" rx="4" fill="#6f5738"/>
    <rect x="432" y="279" width="10" height="18" rx="4" fill="#6f5738"/>

    <!-- 第 6 层 -->
    <rect x="345" y="220" width="110" height="42" fill="#efe0bd" stroke="#a08a63" stroke-width="2"/>
    <path d="M336 228 Q400 208 464 228 L459 228 Q400 219 341 228 Z" fill="#63513f"/>
    <rect x="394" y="235" width="12" height="24" rx="6" fill="#5a442f"/>

    <!-- 第 7 层 -->
    <rect x="353" y="178" width="94" height="42" fill="#e9d8b2" stroke="#a08a63" stroke-width="2"/>
    <path d="M345 186 Q400 166 455 186 L450 186 Q400 177 350 186 Z" fill="#63513f"/>
    <rect x="395" y="193" width="10" height="22" rx="5" fill="#5a442f"/>

    <!-- 塔刹 -->
    <rect x="397" y="118" width="6" height="62" fill="#7a5c30"/>
    <circle cx="400" cy="172" r="9" fill="#c8a45c" stroke="#8a6d2f" stroke-width="2"/>
    <circle cx="400" cy="152" r="7" fill="#d8b76a" stroke="#8a6d2f" stroke-width="2"/>
    <circle cx="400" cy="134" r="5" fill="#c8a45c"/>
    <circle cx="400" cy="116" r="6" fill="#b08d3f"/>
  </g>

  <!-- 前景草地 -->
  <path d="M0 556 Q 260 528 520 548 Q 680 558 800 544 L800 600 L0 600 Z" fill="#4e7a56"/>
</svg>
