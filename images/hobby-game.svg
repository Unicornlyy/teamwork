<?xml version="1.0" encoding="UTF-8"?>
<!-- 爱好示意图：游戏（SVG 矢量图，可替换为真实照片） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#bg)"/>

  <!-- 霓虹光晕 -->
  <ellipse cx="400" cy="300" rx="360" ry="200" fill="#f59e0b" opacity="0.10"/>

  <!-- 游戏手柄主体 -->
  <g transform="translate(400 300)">
    <!-- 握把 -->
    <path d="M-250 -10 Q-285 20 -265 110 Q-250 165 -205 165 Q-175 165 -168 120 L-150 60 Z"
          fill="url(#pad)"/>
    <path d="M250 -10 Q285 20 265 110 Q250 165 205 165 Q175 165 168 120 L150 60 Z"
          fill="url(#pad)"/>
    <!-- 中央机身 -->
    <rect x="-255" y="-70" width="510" height="150" rx="75" fill="url(#pad)"/>
    <!-- 顶部光泽 -->
    <rect x="-200" y="-52" width="400" height="26" rx="13" fill="#ffffff" opacity="0.45"/>

    <!-- 左侧十字键 -->
    <g fill="#334155">
      <rect x="-196" y="-22" width="64" height="22" rx="4"/>
      <rect x="-175" y="-43" width="22" height="64" rx="4"/>
    </g>
    <!-- 右侧四颗按钮 -->
    <circle cx="150" cy="-34" r="17" fill="#ef4444"/>
    <circle cx="186" cy="2" r="17" fill="#3b82f6"/>
    <circle cx="150" cy="38" r="17" fill="#22c55e"/>
    <circle cx="114" cy="2" r="17" fill="#f59e0b"/>
    <g fill="#ffffff" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">
      <text x="150" y="-28">Y</text>
      <text x="186" y="8">B</text>
      <text x="150" y="44">A</text>
      <text x="114" y="8">X</text>
    </g>
    <!-- 中间两个小功能键 -->
    <rect x="-30" y="-12" width="26" height="10" rx="5" fill="#64748b"/>
    <rect x="14" y="-12" width="26" height="10" rx="5" fill="#64748b"/>
  </g>

  <!-- 装饰像素方块 -->
  <g opacity="0.8">
    <rect x="96" y="120" width="18" height="18" fill="#f472b6"/>
    <rect x="118" y="142" width="18" height="18" fill="#fbbf24"/>
    <rect x="660" y="130" width="18" height="18" fill="#34d399"/>
    <rect x="638" y="152" width="18" height="18" fill="#60a5fa"/>
  </g>

  <text x="400" y="528" text-anchor="middle" font-family="Microsoft YaHei, sans-serif"
        font-size="52" font-weight="bold" fill="#fcd34d" letter-spacing="12">游 戏</text>
  <text x="400" y="572" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="22" fill="#fbbf24" letter-spacing="8" opacity="0.9">GAMING TIME</text>
</svg>
